# Configuracion del backend del simulador (seccion 4 de CLAUDE.md).
# Cualquier valor se puede cambiar al arrancar: java -jar target/simulador-planta.jar --planta.semilla=42

# Semilla del generador aleatorio. La misma semilla repite la misma simulacion.
planta.semilla=7

# Milisegundos entre ticks cuando la simulacion esta en ejecucion.
planta.intervalo-ms=800
